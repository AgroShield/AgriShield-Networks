[workspace]
resolver = "2"
members = [
  "contracts/policy-registry",
  "contracts/oracle-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AgriShield Contributors"]
repository = "https://github.com/AgroShield/AgriShield-Networks"

[workspace.dependencies]
soroban-sdk = "22.0.0"

# Soroban contracts are deployed as small wasm blobs, so optimise for size and
# deterministic behaviour rather than raw throughput.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
debug = 0
strip = "symbol"
