name: contracts

# The release profile is only exercised by a release build, so nothing in the
# default profile can catch a bad value in it. This runs the one build that
# reads it, for the target the contracts are deployed to.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - contracts/**
      - scripts/check-release-profile.sh
      - .github/workflows/contracts.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - contracts/**
      - scripts/check-release-profile.sh
      - .github/workflows/contracts.yml
  workflow_dispatch:

jobs:
  release-profile:
    name: release profile and reproducible wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `wasm32v1-none` is the only wasm target the Soroban runtime accepts.
      - name: Add the wasm target
        run: rustup target add wasm32v1-none

      - name: Build the release profile for wasm32
        run: ./scripts/check-release-profile.sh

      # Shares the build above, so this costs one rebuild rather than two.
      - name: Rebuild into a second target directory and compare
        run: ./scripts/check-wasm-reproducible.sh

  test:
    name: contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Host tests, so the wasm target is not involved; the toolchain and its
      # components come from rust-toolchain.toml.
      - name: Run the contract test suite
        run: cargo test --workspace

  lint:
    name: rustfmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same two commands as `pnpm fmt:contracts` and `pnpm lint:contracts`;
      # clippy denies warnings so a new one fails rather than accumulating.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
